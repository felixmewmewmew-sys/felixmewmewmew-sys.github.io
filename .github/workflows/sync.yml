name: Обновить Lampa
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Свежая Lampa + домашние правки
        run: |
          git clone --depth 1 https://github.com/yumata/lampa.git /tmp/up
          rsync -a --delete --exclude .git --exclude .github --exclude personal --exclude msx/start.json /tmp/up/ ./
          sh personal/apply.sh
          git config user.name "lampa-sync"
          git config user.email "lampa-sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Lampa $(date +%F)"
          git push
